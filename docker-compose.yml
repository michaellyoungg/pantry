services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: pantry
      POSTGRES_PASSWORD: pantry
      POSTGRES_DB: pantry
    ports:
      # Host 5433 -> container 5432. 5432 is commonly occupied by other local
      # Postgres containers; the service itself reaches Postgres in-network at
      # postgres:5432 regardless of this host binding.
      - "5433:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pantry"]
      interval: 3s
      timeout: 3s
      retries: 10

  recipe-service:
    build:
      context: ./apps/recipe-service
    environment:
      PORT: "8090"
      DATABASE_URL: postgres://pantry:pantry@postgres:5432/pantry?sslmode=disable
      RECIPE_SERVICE_SECRET: ${RECIPE_SERVICE_SECRET:?set RECIPE_SERVICE_SECRET in .env}
      # Optional: enables the Claude fallback for URL import (BL-0001). Unset =
      # JSON-LD-only import; the ":-" default keeps compose happy when it is absent.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Optional: enables live USDA FoodData Central lookups for nutrition
      # (BL-0036). Unset = the checked-in snapshot alone, which still resolves
      # common ingredients and reports coverage honestly for the rest.
      FDC_API_KEY: ${FDC_API_KEY:-}
      # Unset by default: telemetry is a no-op without it, so the plain
      # `docker compose up` stack and CI never try to reach a collector.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: recipe-service
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build:
      context: ./apps/recipe-service
      target: seed
    environment:
      DATABASE_URL: postgres://pantry:pantry@postgres:5432/pantry?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [seed]

  convex-backend:
    # Pinned by digest for reproducibility (never :latest — see backlog BL-0008).
    # Convex tags self-hosted images by git commit SHA, not semver, so we pin the
    # immutable digest. Pinned 2026-06-30 (was :latest). To bump: pull the new
    # :latest, read `docker image inspect ghcr.io/get-convex/convex-backend:latest
    # --format '{{index .RepoDigests 0}}'`, and update both this and the dashboard.
    image: ghcr.io/get-convex/convex-backend@sha256:705b8d89a7f812c5ef49937be8154bf8e5c803d596cc980fa53fc33dc7380d0c
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "3210:3210"
      - "3211:3211"
    volumes:
      # SQLite lives here by default (db.sqlite3), alongside file storage and
      # the generated instance credentials. The latter two stay here even with
      # Postgres backing, so this volume is always load-bearing.
      #
      # For the Postgres-backed configuration we intend to run in production,
      # layer deploy/docker-compose.convex-postgres.yml on top — it is an
      # override rather than the default so that pulling it cannot silently
      # re-point an existing stack at an empty database. Backups, the restore
      # drill and the upgrade procedure: docs/self-hosted-convex-ops.md.
      - ./.data/convex:/convex/data
    # Observability (BL-0027): Convex action spans are opt-in. The backend reads
    # OTEL_EXPORTER_OTLP_ENDPOINT from its deployment env (set via `convex env
    # set`), not from compose, so the default stack stays quiet.
    environment:
      - INSTANCE_SECRET=${CONVEX_INSTANCE_SECRET:?set CONVEX_INSTANCE_SECRET in .env}
      - CONVEX_CLOUD_ORIGIN=http://127.0.0.1:3210
      - CONVEX_SITE_ORIGIN=http://127.0.0.1:3211
      - DISABLE_BEACON=true
      - RUST_LOG=info
      - DOCUMENT_RETENTION_DELAY=172800
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3210/version"]
      interval: 5s
      start_period: 10s
      retries: 10

  convex-dashboard:
    # Pinned by digest — keep in lockstep with convex-backend above (BL-0008).
    image: ghcr.io/get-convex/convex-dashboard@sha256:f3a8ccb90a07c9cb580974c0e4a03f38137b5b53dd4c70cd5b242d5d7ae2260b
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "6791:6791"
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=http://127.0.0.1:3210
    depends_on:
      convex-backend:
        condition: service_healthy

  # Observability (BL-0027). Opt in with: docker compose --profile obs up
  # Pinned by digest per BL-0008. To bump: pull :latest and re-read the digest.
  alloy:
    image: grafana/alloy@sha256:491b0578c04983fd54fe99b587b6fab4404dc46d0dc16677bd6b00cc1140b308
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
    ports:
      - "4317:4317"   # OTLP gRPC  (recipe-service)
      - "4318:4318"   # OTLP HTTP  (browser, Convex)
      - "12345:12345" # Alloy pipeline UI
    depends_on:
      - otel-lgtm
    profiles: [obs]

  otel-lgtm:
    image: grafana/otel-lgtm@sha256:46ca028e294bd728e8e930a28e887f640a8f2a9533cc283f79bcc6ab73d2ffd8
    ports:
      # 3001 on the host: 3000 is a common dev-server default and this is the
      # container we least want to fight over a port with.
      - "3001:3000"
    profiles: [obs]
