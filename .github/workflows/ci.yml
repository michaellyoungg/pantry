name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets you trigger CI on demand from the Actions tab ("Run workflow")
  # or via `gh workflow run CI --ref <branch>`.
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes from agents).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Speeds up repeat runs by reusing Turborepo's task cache.
      - name: Restore Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Lint & format (Biome)
        run: pnpm biome check

      # The backlog index table is generated from each item's frontmatter, so a
      # claim is a one-file edit and parallel agents stop conflicting on it.
      - name: Backlog index is current
        run: pnpm backlog:index:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (with coverage)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Dead code / unused deps (Knip)
        run: pnpm knip

  go:
    name: Go (vet · test · lint · vuln)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/recipe-service
    # Postgres for the recipe-service <-> DB integration tests (postgres_test.go).
    # Without PANTRY_TEST_DATABASE_URL those tests t.Skip, so CI previously never
    # exercised the real DB code path — this closes that gap.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pantry
          POSTGRES_PASSWORD: pantry
          POSTGRES_DB: pantry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pantry"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/recipe-service/go.mod
          cache-dependency-path: apps/recipe-service/go.sum

      - name: Verify formatting (gofmt)
        run: test -z "$(gofmt -l .)" || (echo 'Run gofmt -w .' && gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test (race + coverage)
        run: go test -race -cover ./...
        env:
          PANTRY_TEST_DATABASE_URL: postgres://pantry:pantry@localhost:5432/pantry_test?sslmode=disable

      # v8 of the action installs golangci-lint v2 (our .golangci.yml uses the
      # v2 schema); "latest" is built with a Go >= the module's go directive.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: apps/recipe-service

      # Free, official Go vulnerability scanning (no GitHub Advanced Security
      # required, unlike CodeQL on private repos). Advisory only: stdlib CVEs
      # are fixed by bumping the Go toolchain, so this shouldn't block PRs.
      - name: Vulnerability scan (govulncheck, advisory)
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  integration:
    name: Integration (Convex ⇄ recipe-service ⇄ Postgres)
    runs-on: ubuntu-latest
    # Exercises the real cross-service contract: the Convex actions in
    # recipes.ts make genuine HTTP calls to a running recipe-service backed by
    # Postgres — no fetch mock. Catches contract drift the unit suites can't.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pantry
          POSTGRES_PASSWORD: pantry
          POSTGRES_DB: pantry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pantry"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      PANTRY_TEST_DATABASE_URL: postgres://pantry:pantry@localhost:5432/pantry_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/recipe-service/go.mod
          cache-dependency-path: apps/recipe-service/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Prebuild the service so the test's globalSetup launches a binary
      # (fast, deterministic) rather than compiling via `go run` on first hit.
      - name: Build recipe-service
        run: go build -o "$RUNNER_TEMP/recipe-service" ./cmd/server
        working-directory: apps/recipe-service

      - name: Integration tests (Convex ⇄ recipe-service)
        run: pnpm --filter @pantry/convex test:integration
        env:
          RECIPE_SERVICE_BIN: ${{ runner.temp }}/recipe-service

  e2e:
    name: E2E (Playwright · full browser loop)
    runs-on: ubuntu-latest
    # Drives the whole user loop in a real browser against a compose-up stack
    # (self-hosted Convex + Postgres + recipe-service + the Vite dev server):
    # sign up → recipe → plan → generate list → check off → reload persists,
    # plus cross-recipe aggregation and per-user isolation. Catches the
    # cross-service, in-browser regressions the unit + integration suites can't
    # (Convex Auth, Convex reactivity, the controlled checkbox). Heavier than the
    # other jobs, so it runs on its own. See scripts/e2e.sh.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Chromium + its OS libraries (libnspr4, libnss3, libgbm1, libasound2, …).
      - name: Install Playwright browser
        run: pnpm --filter @pantry/web exec playwright install --with-deps chromium

      # Brings up the stack, provisions the Convex deployment (admin key, auth
      # JWT keys, recipe-service wiring), pushes functions, then runs Playwright
      # (which starts the Vite dev server itself). Docker + Compose are preinstalled
      # on ubuntu runners.
      - name: End-to-end (compose stack + Playwright)
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore
