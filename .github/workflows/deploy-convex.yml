# Deploy Convex functions and schema (BL-0006, increment 2).
#
# Functions live in git and reach a deployment only through
# scripts/provision-convex.sh, so without this a merged schema change silently
# does not reach either environment until someone remembers to run it.
#
# `--preserve-auth-keys` is mandatory and is what makes this safe unattended: it
# sets every other deployment variable but leaves an existing RS256 keypair
# alone. Regenerating JWT_PRIVATE_KEY would sign out every session ever issued,
# and the flag's absence is what keeps the e2e suite self-isolating.
#
# DEV IS AUTOMATIC, PRODUCTION IS NOT, and that asymmetry is deliberate.
# Production's Railway services carry no deploy trigger and are promoted by
# hand, so auto-deploying production's SCHEMA would let it run ahead of the web
# bundle that uses it: a removed field would break the live app with nothing
# merged to explain it. Promote production here the same way you promote its
# services, by choosing it in "Run workflow".
#
# The runner never needs Railway's private network. RECIPE_SERVICE_URL is stored
# on the deployment as a string for Convex itself to call, so a public runner
# only has to reach the Convex backend's public domain.
name: Deploy Convex

on:
  push:
    branches: [main]
    paths:
      - "packages/convex/**"
      - "scripts/provision-convex.sh"
      - "scripts/lib/convex-deployment.sh"
      - ".github/workflows/deploy-convex.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Which deployment to provision"
        type: choice
        options: [dev, production]
        default: dev

concurrency:
  # Never two pushes to the same deployment at once; do not cancel a run that is
  # midway through applying a schema.
  group: deploy-convex-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ github.event.inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A push always targets dev. Only an explicit dispatch can select
      # production, so there is no path from a merge to production's schema.
      - name: Resolve target
        id: target
        run: echo "env=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'dev' }}" >> "$GITHUB_OUTPUT"

      - name: Provision dev
        if: steps.target.outputs.env == 'dev'
        env:
          CONVEX_SELF_HOSTED_URL: ${{ vars.CONVEX_DEV_URL }}
          CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ secrets.CONVEX_DEV_ADMIN_KEY }}
          RECIPE_SERVICE_SECRET: ${{ secrets.RECIPE_SERVICE_SECRET_DEV }}
        run: |
          set -euo pipefail
          bash scripts/provision-convex.sh --preserve-auth-keys \
            --site-url "${{ vars.SITE_URL_DEV }}" \
            --recipe-service-url http://recipe-service.railway.internal:8090 \
            > /dev/null

      - name: Provision production
        if: steps.target.outputs.env == 'production'
        env:
          CONVEX_SELF_HOSTED_URL: ${{ vars.CONVEX_PROD_URL }}
          CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ secrets.CONVEX_PROD_ADMIN_KEY }}
          RECIPE_SERVICE_SECRET: ${{ secrets.RECIPE_SERVICE_SECRET_PROD }}
        run: |
          set -euo pipefail
          bash scripts/provision-convex.sh --preserve-auth-keys \
            --site-url "${{ vars.SITE_URL_PROD }}" \
            --recipe-service-url http://recipe-service.railway.internal:8090 \
            > /dev/null
