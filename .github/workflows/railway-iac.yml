# Apply the declared Railway topology (BL-0006, increment 2).
#
# `.railway/railway.ts` is the source of truth for builders, deploy triggers,
# regions, volumes, cron schedules and serverless flags. Until this workflow
# existed, applying it meant someone running `railway config apply` from a
# laptop, which has the same flaw as `railway up`: it applies whatever is
# checked out, and nothing records who changed the infrastructure or when.
#
# This is the ONLY thing that applies topology, for BOTH environments. Dev
# applies automatically on a push; production is applied by dispatching this
# workflow deliberately. promote.yml only CHECKS that production's topology is
# current and fails if it is not, because an apply queues its own deployments
# and those would race the pinned ones a promotion is about to start.
#
# Tokens are scoped to ONE environment, so there are two, and dev's cannot
# touch production. That is a property worth keeping: the blast radius of a
# leaked CI credential stops at the environment it was issued for.
#
# `--confirm-destructive` is deliberately NOT passed. A plan that would destroy
# a resource therefore FAILS here rather than proceeding, and a destructive
# change has to be made by a human who has read the plan.
#
# AND THE APPLY IS VERIFIED, because "applied" is not evidence of applied.
# Railway reported status:"applied" with no diagnostics for a volume region
# change it did not perform, leaving the plan permanently dirty. The re-plan
# after the apply is what turns that into a failed run instead of a green one.
name: Railway IaC

on:
  push:
    branches: [main]
    paths:
      - ".railway/**"
      - ".github/workflows/railway-iac.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment to apply"
        type: choice
        options: [dev, production]
        default: dev
      mode:
        description: "plan only, or apply"
        type: choice
        options: [plan, apply]
        default: plan

concurrency:
  # Never two applies against the same environment at once, and never an apply
  # underneath a promotion: promote.yml shares this group for production.
  group: railway-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  apply:
    name: ${{ github.event.inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      # The `railway` SDK types .railway/railway.ts; the CLI runs plan/apply.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the Railway CLI
        run: npm i -g @railway/cli

      - name: Resolve target
        id: target
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "env=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            echo "env=dev" >> "$GITHUB_OUTPUT"
            echo "mode=apply" >> "$GITHUB_OUTPUT"
          fi

      # Always print the plan, including before an apply, so the run's log is a
      # record of what changed rather than just that something did.
      # One token per environment: selected by name so neither is ever present
      # in a run targeting the other.
      - name: Plan
        env:
          RAILWAY_TOKEN: ${{ steps.target.outputs.env == 'production' && secrets.RAILWAY_TOKEN_PRODUCTION || secrets.RAILWAY_TOKEN_DEV }}
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::No Railway token for ${{ steps.target.outputs.env }}." \
                 "Create a project token scoped to that environment in the Railway" \
                 "dashboard (Project Settings -> Tokens) and store it as" \
                 "RAILWAY_TOKEN_PRODUCTION or RAILWAY_TOKEN_DEV."
            exit 1
          fi
          railway config plan --environment "${{ steps.target.outputs.env }}"

      - name: Apply
        if: steps.target.outputs.mode == 'apply'
        env:
          RAILWAY_TOKEN: ${{ steps.target.outputs.env == 'production' && secrets.RAILWAY_TOKEN_PRODUCTION || secrets.RAILWAY_TOKEN_DEV }}
        run: railway config apply --environment "${{ steps.target.outputs.env }}" --yes

      # Confirm the apply converged. Railway has reported a change as applied
      # and not made it, which a plan-then-apply run cannot notice: the next run
      # plans the same change again and the drift survives indefinitely.
      - name: Verify the apply converged
        if: steps.target.outputs.mode == 'apply'
        env:
          RAILWAY_TOKEN: ${{ steps.target.outputs.env == 'production' && secrets.RAILWAY_TOKEN_PRODUCTION || secrets.RAILWAY_TOKEN_DEV }}
        run: |
          set -euo pipefail
          code=0
          railway config plan --environment "${{ steps.target.outputs.env }}" --detailed-exit-code || code=$?
          case "$code" in
          0) echo "Converged: ${{ steps.target.outputs.env }} matches .railway/railway.ts." ;;
          2)
            echo "::error::The apply reported success but ${{ steps.target.outputs.env }}" \
                 "still does not match .railway/railway.ts. The plan above lists what" \
                 "Railway did not actually change."
            exit 1
            ;;
          *)
            echo "::error::railway config plan failed with exit $code"
            exit 1
            ;;
          esac
