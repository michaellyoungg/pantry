# Apply the declared Railway topology (BL-0006, increment 2).
#
# `.railway/railway.ts` is the source of truth for builders, deploy triggers,
# regions, volumes, cron schedules and serverless flags. Until this workflow
# existed, applying it meant someone running `railway config apply` from a
# laptop, which has the same flaw as `railway up`: it applies whatever is
# checked out, and nothing records who changed the infrastructure or when.
#
# Branch mapping mirrors the deployments themselves, which is the point: the
# same push that moves the code moves the infrastructure it runs on.
#   main    -> dev
#   release -> production
#
# Tokens are scoped to ONE environment, so there are two, and dev's cannot
# touch production. That is a property worth keeping: the blast radius of a
# leaked CI credential stops at the environment it was issued for.
#
# `--confirm-destructive` is never passed on a push. A destructive apply fails
# instead, and has to be re-run deliberately through "Run workflow" with the
# confirm_destructive input. That keeps the automatic path safe while leaving
# the deliberate one possible.
#
# Note that `Plan: 0 to destroy` does NOT mean an apply is non-destructive.
# Moving a database between regions reports as a change and is refused as a
# destroy, because the volume is recreated. The counter is not the signal; the
# apply's refusal is.
name: Railway IaC

on:
  push:
    branches: [main, release]
    paths:
      - ".railway/**"
      - ".github/workflows/railway-iac.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment to apply"
        type: choice
        options: [dev, production]
        default: dev
      mode:
        description: "plan only, or apply"
        type: choice
        options: [plan, apply]
        default: plan
      confirm_destructive:
        description: "Allow an apply that destroys or recreates resources (e.g. moving a database between regions, which empties its volume)"
        type: boolean
        default: false

concurrency:
  # Never two applies against the same environment at once.
  group: railway-iac-${{ github.event.inputs.environment || (github.ref_name == 'release' && 'production' || 'dev') }}
  cancel-in-progress: false

jobs:
  apply:
    name: ${{ github.event.inputs.environment || (github.ref_name == 'release' && 'production' || 'dev') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      # The `railway` SDK types .railway/railway.ts; the CLI runs plan/apply.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the Railway CLI
        run: npm i -g @railway/cli

      - name: Resolve target
        id: target
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "env=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "release" ]; then
            echo "env=production" >> "$GITHUB_OUTPUT"
            echo "mode=apply" >> "$GITHUB_OUTPUT"
          else
            echo "env=dev" >> "$GITHUB_OUTPUT"
            echo "mode=apply" >> "$GITHUB_OUTPUT"
          fi

      # Always print the plan, including before an apply, so the run's log is a
      # record of what changed rather than just that something did.
      # One token per environment: selected by name so neither is ever present
      # in a run targeting the other.
      - name: Plan
        env:
          RAILWAY_TOKEN: ${{ steps.target.outputs.env == 'production' && secrets.RAILWAY_TOKEN_PRODUCTION || secrets.RAILWAY_TOKEN_DEV }}
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::No Railway token for ${{ steps.target.outputs.env }}." \
                 "Create a project token scoped to that environment in the Railway" \
                 "dashboard (Project Settings -> Tokens) and store it as" \
                 "RAILWAY_TOKEN_PRODUCTION or RAILWAY_TOKEN_DEV."
            exit 1
          fi
          railway config plan --environment "${{ steps.target.outputs.env }}"

      - name: Apply
        if: steps.target.outputs.mode == 'apply'
        env:
          RAILWAY_TOKEN: ${{ steps.target.outputs.env == 'production' && secrets.RAILWAY_TOKEN_PRODUCTION || secrets.RAILWAY_TOKEN_DEV }}
          # Only ever true for a hand-triggered run. A push cannot set it.
          CONFIRM_DESTRUCTIVE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_destructive == 'true' }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM_DESTRUCTIVE" = "true" ]; then
            echo "::warning::Applying with --confirm-destructive to ${{ steps.target.outputs.env }}; resources may be recreated and volumes emptied."
            railway config apply --environment "${{ steps.target.outputs.env }}" --yes --confirm-destructive
          else
            railway config apply --environment "${{ steps.target.outputs.env }}" --yes
          fi
