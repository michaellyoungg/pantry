# The recipe-service HTTP contract — the single source of truth for the shapes
# that cross the Convex/Go boundary (BL-0007).
#
# Two things are derived from this file and checked in:
#
#   - packages/types/src/contract.generated.ts — the TypeScript wire types every
#     JS consumer imports through @pantry/types.
#   - apps/recipe-service/internal/contract/spec_gen_test.go — the table the Go
#     conformance test reflects the hand-written server structs against.
#
# Regenerate with `pnpm contract:codegen`; `pnpm contract:check` (CI) fails if
# either output is stale. See contract/README.md for why the Go side is checked
# rather than generated.
#
# Only a documented subset of OpenAPI is understood by the generator — see
# contract/README.md#the-subset. Adding a keyword it does not know is a codegen
# error, not a silent omission.
openapi: 3.1.0

info:
  title: pantry recipe-service
  version: "1.0.0"
  description: >-
    The canonical source of truth for recipe definitions, ingredient
    normalization, grocery-list aggregation, nutrition, pricing and
    recommendations. It holds no user state: Convex passes the full user context
    on every request.

servers:
  - url: http://recipe-service:8080
    description: The compose-network address Convex actions call.

security:
  - serviceSecret: []
    userId: []

tags:
  - name: recipes
  - name: catalog
  - name: grocery
  - name: normalization
  - name: equipment
  - name: nutrition
  - name: pricing
  - name: recommendations
  - name: prep
  - name: ops

paths:
  /healthz:
    get:
      tags: [ops]
      operationId: healthz
      summary: Liveness probe. The one route exempt from the service secret.
      security: []
      responses:
        "200":
          description: The service is up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }

  /recipes:
    post:
      tags: [recipes]
      operationId: createRecipe
      summary: Create a recipe owned by the calling user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRecipeRequest" }
      responses:
        "201":
          description: The stored recipe, including any prep tasks the write carried.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        "400": { $ref: "#/components/responses/BadRequest" }
    get:
      tags: [recipes]
      operationId: listRecipes
      summary: Every recipe the calling user owns.
      responses:
        "200":
          description: The caller's recipes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Recipe" }

  /recipes/{id}:
    parameters:
      - $ref: "#/components/parameters/RecipeId"
    get:
      tags: [recipes]
      operationId: getRecipe
      summary: One recipe the caller owns.
      responses:
        "200":
          description: The recipe.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [recipes]
      operationId: updateRecipe
      summary: >-
        Replace a recipe wholesale. An omitted field CLEARS the stored value, so
        callers echo back whatever they want to keep.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRecipeRequest" }
      responses:
        "200":
          description: The updated recipe.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [recipes]
      operationId: deleteRecipe
      summary: Delete one recipe the caller owns.
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/NotFound" }

  /recipes/{id}/nutrition:
    parameters:
      - $ref: "#/components/parameters/RecipeId"
    get:
      tags: [nutrition]
      operationId: recipeNutrition
      summary: Estimated nutrients for one recipe the caller can read.
      responses:
        "200":
          description: The estimate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionEstimate" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /recipes/import:
    post:
      tags: [recipes]
      operationId: importRecipe
      summary: Import a recipe from a URL and store it for the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportRecipeRequest" }
      responses:
        "200":
          description: The imported recipe.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /users/me/recipes:
    delete:
      tags: [recipes]
      operationId: deleteUserRecipes
      summary: >-
        Erase the caller's whole recipe corpus — the recipe-service half of
        account deletion (BL-0068). Idempotent: deleting nothing is 200 with a
        count of zero.
      responses:
        "200":
          description: How many recipes were removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteUserRecipesResponse" }
        "403":
          description: The shared catalog cannot be deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /catalog:
    get:
      tags: [catalog]
      operationId: listCatalog
      summary: The shared, system-curated recipe catalog.
      responses:
        "200":
          description: Catalog recipes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Recipe" }

  /catalog/{id}/add:
    parameters:
      - $ref: "#/components/parameters/RecipeId"
    post:
      tags: [catalog]
      operationId: addFromCatalog
      summary: >-
        Clone a catalog recipe into the caller's own recipes. Idempotent — a
        second call returns the existing clone with 200 instead of making another.
      responses:
        "200":
          description: The clone the caller already had.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        "201":
          description: The newly created clone.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /grocery-list:
    post:
      tags: [grocery]
      operationId: groceryList
      summary: Aggregate a set of scaled recipes into one grocery list.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroceryListRequest" }
      responses:
        "200":
          description: The aggregated lines, in aisle order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GroceryLine" }

  /normalization/lookup:
    post:
      tags: [normalization]
      operationId: normalizationLookup
      summary: >-
        Resolve raw ingredient text against the normalization dictionary.
        Duplicate results are collapsed, so callers cannot tell what an
        individual entry became — use /normalization/avoid when that matters.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NormalizationLookupRequest" }
      responses:
        "200":
          description: One entry per distinct canonical item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NormalizationLookupResponse" }

  /normalization/avoid:
    post:
      tags: [normalization]
      operationId: normalizationAvoid
      summary: >-
        Resolve free-typed avoid-list entries one-to-one and in order, so a
        caller can tell an entry that matches a whole allergen family from one
        that matches nothing at all (BL-0052).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AvoidResolutionRequest" }
      responses:
        "200":
          description: What each entry resolved to.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvoidResolutionResponse" }

  /normalization/coverage:
    get:
      tags: [normalization]
      operationId: normalizationCoverage
      summary: >-
        How much of the ingredient text in the caller's recipes plus the shared
        catalog resolves to a canonical item, and what did not.
      responses:
        "200":
          description: The dictionary's report card.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoverageReport" }

  /equipment:
    get:
      tags: [equipment]
      operationId: listEquipment
      summary: The curated hardware catalog. Reference data, same for every caller.
      responses:
        "200":
          description: Every equipment entry.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EquipmentDef" }

  /equipment/match:
    post:
      tags: [equipment]
      operationId: equipmentMatch
      summary: >-
        Classify the caller's recipes plus the catalog against an inventory.
        Nothing is dropped: blocked recipes come back flagged and untagged ones
        come back `unknown` (BL-0043).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EquipmentMatchRequest" }
      responses:
        "200":
          description: The classified recipes and the counts over all of them.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EquipmentMatchResult" }

  /pricing/estimate:
    post:
      tags: [pricing]
      operationId: pricingEstimate
      summary: Price a set of already-aggregated grocery lines.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PricingEstimateRequest" }
      responses:
        "200":
          description: The estimate, its per-line outcomes, and its basis.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CostEstimate" }
        "500": { $ref: "#/components/responses/ServerError" }

  /pricing/store-provider:
    get:
      tags: [pricing]
      operationId: pricingStoreProvider
      summary: Report whether real store prices are configured (BL-0046).
      description: >-
        The feature flag, as seen from outside the service. A client asks this
        before offering a store chooser, so a deployment without the flag or
        without credentials shows no control rather than a dead one. It makes no
        upstream call.
      responses:
        "200":
          description: Whether store prices are available, and from which provider.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreProviderStatus" }

  /pricing/stores:
    post:
      tags: [pricing]
      operationId: pricingStores
      summary: Find stores near a zip code for the user to price against.
      description: >-
        Returns an empty list and no provider when real store prices are not
        configured. A 502 means the retailer's directory could not be reached,
        which is a failure of this search alone — pricing a grocery list never
        fails, it falls back to the national averages.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoreSearchRequest" }
      responses:
        "200":
          description: The nearby stores, or an empty list when the feature is off.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreSearchResult" }
        "502": { $ref: "#/components/responses/ServerError" }

  /nutrition/estimate:
    post:
      tags: [nutrition]
      operationId: nutritionEstimate
      summary: Roll a set of scaled recipes up into one nutrient estimate.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NutritionEstimateRequest" }
      responses:
        "200":
          description: The rollup, with per-recipe coverage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionEstimate" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /recommendations/pantry:
    post:
      tags: [recommendations]
      operationId: recommendPantry
      summary: Rank the caller's recipes plus the catalog against their pantry.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecommendationRequest" }
      responses:
        "200":
          description: The ranked results and the full text of any generated candidate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecommendationResponse" }

  /recommendations/discover:
    post:
      tags: [recommendations]
      operationId: recommendDiscover
      summary: >-
        Rank recipes the caller has NOT saved. No generated candidates: an
        invented recipe is the opposite of a discovery.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecommendationRequest" }
      responses:
        "200":
          description: The ranked results.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoverResponse" }

  /prep-tasks:
    post:
      tags: [prep]
      operationId: prepTasks
      summary: >-
        Derive lead-time prep for a set of planned meals. `cookDate` and `today`
        are supplied by the caller, never read from the server clock — the
        browser knows the user's local date and the server does not.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrepTasksRequest" }
      responses:
        "200":
          description: Derived tasks, grouped by meal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrepTasksResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }

components:
  securitySchemes:
    serviceSecret:
      type: apiKey
      in: header
      name: X-Service-Secret
      description: The shared secret every route but /healthz is gated behind.
    userId:
      type: apiKey
      in: header
      name: X-User-Id
      description: >-
        The authenticated user, supplied by Convex. recipe-service holds no user
        state, so this is the only thing that scopes a request.

  parameters:
    RecipeId:
      name: id
      in: path
      required: true
      description: The recipe id.
      schema: { type: string }

  responses:
    BadRequest:
      description: The request was malformed or failed validation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: No such recipe is visible to this caller.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unprocessable:
      description: The page could not be turned into a recipe.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    BadGateway:
      description: An upstream fetch failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ServerError:
      description: The service could not complete the request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unavailable:
      description: An optional surface (import, nutrition) is not configured.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    # ── Errors and small envelopes ──────────────────────────────────────────
    HealthResponse:
      type: object
      description: The liveness payload. Always `{"status":"ok"}`.
      x-go-unbound: written inline by the healthz handler as a map literal.
      required: [status]
      properties:
        status: { type: string }

    ErrorResponse:
      type: object
      description: |-
        Every non-2xx response body. One field, always present: the message
        `writeError` recorded, never a stack or an internal cause.
      x-go-unbound: written inline by writeErr as a map literal.
      required: [error]
      properties:
        error: { type: string }

    DeleteUserRecipesResponse:
      type: object
      description: How many recipes the account-deletion cascade removed (BL-0068).
      x-go-unbound: written inline by the deleteUserRecipes handler as a map literal.
      required: [deleted]
      properties:
        deleted: { type: integer }

    # ── Recipes ─────────────────────────────────────────────────────────────
    Ingredient:
      type: object
      x-go-types: [recipe.Ingredient]
      required: [quantity, unit, item]
      properties:
        quantity: { type: number }
        unit: { type: string }
        item: { type: string }
        note: { type: string }

    CookingMethod:
      type: string
      description: |-
        The closed cooking-method enum (BL-0041). Closed on purpose: BL-0042's
        prep rules key on these values, and rules cannot be written against a
        vocabulary that varies per recipe. recipe-service is the source of truth
        (`internal/recipe/equipment.json`).

        Deliberately a type and not a runtime array on the TypeScript side.
        `@pantry/types` ships as `dist` only, and nothing else in the repo
        imports a VALUE from it: the Convex bundler and the Vite dev server both
        resolve it without a build step only while every import is
        `import type`. Consumers that need the members at runtime declare their
        own list and prove it covers this union at compile time — see
        packages/convex/convex/recipes.ts and apps/web/src/lib/cookingMethods.ts.
      x-go-unbound: a bare string on the Go side; the catalog validates membership.
      enum:
        - bake
        - roast
        - grill
        - smoke
        - sous_vide
        - slow_cook
        - pressure_cook
        - fry
        - saute
        - boil
        - marinate
        - no_cook

    EquipmentCategory:
      type: string
      x-go-unbound: a bare string on the Go side; equipment.json validates membership.
      enum: [appliance, cookware, tool]

    EquipmentDef:
      type: object
      description: One entry of the curated hardware catalog served by GET /equipment.
      x-go-types: [recipe.Equipment]
      required: [id, name, category, aliases]
      properties:
        id: { type: string }
        name: { type: string }
        category: { $ref: "#/components/schemas/EquipmentCategory" }
        aliases:
          type: array
          items: { type: string }
        implies:
          description: |-
            Methods that follow unambiguously from the equipment ("crock pot"
            means slow_cook). Absent where the mapping is not certain — a stand
            mixer says nothing about how the dish is cooked.
          type: array
          items: { $ref: "#/components/schemas/CookingMethod" }

    RecipeEquipment:
      type: object
      description: |-
        An equipment tag on a recipe, referencing the catalog by slug.
        `required: false` is "a grill pan works too" — optional gear must not
        block BL-0043's "can I make this?" check.
      x-go-types: [recipe.RecipeEquipment]
      required: [id, required]
      properties:
        id: { type: string }
        required: { type: boolean }

    PrepWindow:
      type: string
      description: |-
        When, relative to the cook date, a piece of prep has to happen (BL-0042).

        Coarse by design — day granularity, no clock times — because the planner
        schedules meals onto days and nothing in it knows what time dinner is.
        Ordered coarsest lead time first, which is also the order tasks are shown
        in: the three-day thaw is both the most urgent to see and the easiest to
        miss.
      x-go-unbound: recipe.PrepWindow is a named string type, checked as a string.
      enum:
        - three_days_before
        - two_days_before
        - night_before
        - morning_of
        - hour_before
        - at_start

    PrepSource:
      type: string
      description: |-
        Which producer emitted a task (BL-0044).

        Three producers, one stream, one precedence order: `manual > llm > rule`,
        applied per task key. A hand-authored task therefore *replaces* the rule
        task it shares a key with rather than appearing beside it.

        - `rule` — derived on read from the versioned rule table. Never stored,
          so improving a rule improves every recipe at once.
        - `llm` — the model matched a rule the deterministic scan missed. The
          text is still the rule's; the model chose the match, not the words.
        - `manual` — the user wrote it.
      x-go-unbound: a bare string on the Go side; prepSourceRank orders the members.
      enum: [rule, llm, manual]

    StoredPrepTask:
      type: object
      description: |-
        A prep task stored on a recipe: the two producers whose output cannot be
        recomputed. Carries no rule id and no due date — it is not derived, and
        its due date depends on the meal it is scheduled for.
      x-go-types: [recipe.StoredPrepTask]
      required: [key, window, text, source]
      properties:
        key:
          description: |-
            The merge identity, shared with `PrepTask.key`.

            A task written to *override* a derived one carries that task's key
            verbatim; that is how "this rule is wrong for this recipe" is
            expressed. A task written fresh gets a key from its own text
            (`manual:take-the-turkey-out`), assigned by the server.
          type: string
        window: { $ref: "#/components/schemas/PrepWindow" }
        text: { type: string }
        source: { $ref: "#/components/schemas/PrepSource" }

    PrepTaskInput:
      type: object
      description: |-
        A prep task on its way *to* the server.

        `key` is omitted when authoring something new and echoed back verbatim
        when editing or overriding. `source` is omitted entirely: the server
        stamps the producer it is writing for, so a client cannot label its own
        guess as something the user wrote. (Create accepts an explicit `llm` for
        tasks a fresh import produced, since the import preview is never
        persisted server-side.)
      x-go-unbound: decoded as recipe.StoredPrepTask; the server stamps `source`.
      x-go-direction: request
      required: [window, text]
      properties:
        key: { type: string }
        window: { $ref: "#/components/schemas/PrepWindow" }
        text: { type: string }
        source:
          description: Never `rule` — rule-derived prep is computed, never stored.
          type: string
          enum: [llm, manual]

    Recipe:
      type: object
      x-go-types: [recipe.Recipe]
      required: [id, userId, title, ingredients, steps, equipment, methods, tags, prepTasks, createdAt]
      properties:
        id: { type: string }
        userId: { type: string }
        title: { type: string }
        servings:
          description: |-
            How many people the recipe feeds. Absent means the yield is unknown —
            existing recipes and manual entry without a yield both leave it
            unset, so consumers must omit per-serving figures rather than assume
            a default.

            This is an absolute count. It is not the planner's
            `servingsMultiplier`, which is a scale factor ("cook 1.5x this
            recipe") on a basket entry.
          type: integer
        ingredients:
          type: array
          items: { $ref: "#/components/schemas/Ingredient" }
        steps:
          description: Ordered instruction lines (the method). Empty for ingredients-only recipes.
          type: array
          items: { type: string }
        equipment:
          description: Equipment tags referencing the catalog. Empty when nothing was detected.
          type: array
          items: { $ref: "#/components/schemas/RecipeEquipment" }
        methods:
          description: Members of the closed method enum. Empty when nothing was detected.
          type: array
          items: { $ref: "#/components/schemas/CookingMethod" }
        cuisine:
          description: |-
            Discovery metadata (BL-0020) — what the catalog's filter chips read.

            `cuisine` and `tags` are an OPEN vocabulary, deliberately unlike
            `methods`. Methods are closed because BL-0042's prep rules key on
            them; nothing keys on a cuisine or a tag, so an import that meets a
            cuisine we have never heard of should keep it rather than drop it.
            recipe-service normalizes both to slugs, so "Gluten Free" and
            "gluten_free" are one chip.

            Absent when unknown.
          type: string
        totalMinutes:
          description: |-
            Wall-clock minutes from starting to eating. Absent means unknown —
            never zero, and never sorted or filtered as if it were fast. This is
            the #1 weeknight filter.
          type: integer
        tags:
          description: |-
            Free-form slugs ("vegan", "one-pot"). Diet lives here rather than in
            its own field: the UI groups the tags it recognizes as diets into a
            chip row, and a tag it does not recognize stays searchable instead of
            being dropped.
          type: array
          items: { type: string }
        sourceUrl:
          description: Where the recipe came from, for attribution and re-import. Absent when hand-entered.
          type: string
        sourceRecipeId:
          description: |-
            The catalog recipe this one was cloned from (BL-0020's clone-on-add).

            Server-owned and read-only: it is the idempotency key that stops a
            second "Add to basket" from making a second copy, so a client cannot
            set it. Present only on recipes that came from the catalog.
          type: string
        prepTasks:
          description: |-
            Prep tasks stored on the recipe: hand-authored and model-derived
            (BL-0044). Rule-derived prep is absent here — it is computed on read
            from the rule table and merged with these, precedence
            `manual > llm > rule`. Usually empty.
          type: array
          items: { $ref: "#/components/schemas/StoredPrepTask" }
        createdAt:
          type: string
          format: date-time

    CreateRecipeRequest:
      type: object
      description: |-
        The write shape for a recipe. Update accepts exactly the same fields and
        replaces the recipe wholesale, so an omitted field CLEARS the stored
        value — callers echo back whatever they want to keep. `sourceRecipeId` is
        absent by design: it is server-owned provenance, not something a client
        sets.
      x-go-unbound: decoded into the unexported recipeBody struct in handler.go.
      x-go-direction: request
      required: [title, ingredients]
      properties:
        title: { type: string }
        servings:
          description: Omit when unknown; recipe-service rejects a value outside 1..100.
          type: integer
        ingredients:
          type: array
          items: { $ref: "#/components/schemas/Ingredient" }
        steps:
          type: array
          items: { type: string }
        equipment:
          type: array
          items: { $ref: "#/components/schemas/RecipeEquipment" }
        methods:
          type: array
          items: { $ref: "#/components/schemas/CookingMethod" }
        cuisine:
          description: Free text; recipe-service slugifies it. Omit when unknown.
          type: string
        totalMinutes:
          description: Omit when unknown. recipe-service rejects zero and negatives.
          type: integer
        tags:
          type: array
          items: { type: string }
        sourceUrl:
          description: Must be an absolute http(s) URL; anything else is rejected.
          type: string
        prepTasks:
          description: |-
            Unlike every field above, an ABSENT value does not clear the stored
            rows: two producers write them independently, so a client that knows
            nothing about prep must not be able to delete what the model tagged
            at import. Send `[]` to clear.
          type: array
          items: { $ref: "#/components/schemas/PrepTaskInput" }

    ImportRecipeRequest:
      type: object
      x-go-unbound: decoded into an anonymous struct in the importRecipe handler.
      x-go-direction: request
      required: [url]
      properties:
        url: { type: string }

    # ── Grocery list ────────────────────────────────────────────────────────
    GroceryListItem:
      type: object
      description: >-
        One recipe on a plan, at the servings dial it is planned at. The same
        shape feeds POST /grocery-list and POST /nutrition/estimate.
      x-go-unbound: decoded into an anonymous struct in the groceryList handler.
      x-go-direction: request
      required: [recipeId, multiplier]
      properties:
        recipeId: { type: string }
        multiplier: { type: number }

    GroceryListRequest:
      type: object
      x-go-unbound: decoded into an anonymous struct in the groceryList handler.
      x-go-direction: request
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GroceryListItem" }

    GroceryLineSource:
      type: object
      description: |-
        One recipe's contribution to an aggregated grocery line.

        `quantity` is in the *parent line's* unit, not the unit the recipe wrote,
        so the contributions add up to the line total — that additivity is the
        question the provenance sheet answers ("why is this ¾ cup?"). The unit is
        therefore not repeated here.
      x-go-types: [recipe.GroceryLineSource]
      required: [recipeId, title, quantity]
      properties:
        recipeId: { type: string }
        title: { type: string }
        quantity: { type: number }

    GroceryPurchase:
      type: object
      description: |-
        What to actually buy for a line, and what survives the cooking (BL-0032).

        This rides ALONGSIDE the line's quantity rather than replacing it: the
        quantity is the need the recipes add up to, and provenance, don't-rebuy
        and pricing are all built on that number. The purchase is a second claim
        — buy this, need that — because nobody sells 2 tbsp of parsley.
      x-go-types: [recipe.GroceryPurchase]
      required: [quantity, unit]
      properties:
        quantity:
          description: "Whole packs: you cannot buy four fifths of a bunch."
          type: number
        unit:
          description: The pack's own name ("bunch", "can"), singular — clients pluralize.
          type: string
        residue:
          description: Surplus left once the recipes take their share; absent on an exact fit.
          type: number
        residueUnit: { type: string }

    GroceryLine:
      type: object
      x-go-types: [recipe.GroceryLine]
      required: [item, canonicalItem, unit, quantity, aisle]
      properties:
        item: { type: string }
        canonicalItem:
          description: Normalized ingredient key ("green onion"); the identity the pantry joins on.
          type: string
        unit: { type: string }
        quantity: { type: number }
        aisle: { type: string }
        sources:
          description: |-
            The recipes this line was aggregated from, in first-seen order.
            Absent for manually added lines and for lines generated before
            BL-0019.
          type: array
          items: { $ref: "#/components/schemas/GroceryLineSource" }
        purchase:
          description: |-
            How this item is sold, when the normalization dataset knows. Absent
            for most of the list — see `GroceryPurchase`.
          $ref: "#/components/schemas/GroceryPurchase"

    # ── Equipment fit ───────────────────────────────────────────────────────
    EquipmentFitStatus:
      type: string
      description: |-
        Whether a recipe's hardware requirements are met by an equipment
        inventory (BL-0043).

        `unknown` is the important one: a recipe carrying no equipment tags has
        never been assessed, and presenting that as `makeable` would turn missing
        data into a green light. UI must render it as "we don't know", never as a
        yes.
      x-go-unbound: recipe.EquipmentFitStatus is a named string type, checked as a string.
      enum: [makeable, blocked, unknown]

    EquipmentFit:
      type: object
      description: |-
        How one recipe fares against an inventory, without the recipe body — the
        compact shape the catalog joins onto recipes it already has.
      x-go-unbound: the Go side carries these fields directly on recipe.EquipmentMatch.
      required: [status, missing, unlockedBy]
      properties:
        status: { $ref: "#/components/schemas/EquipmentFitStatus" }
        missing:
          description: Required equipment slugs the user lacks. Empty unless status is "blocked".
          type: array
          items: { type: string }
        unlockedBy:
          description: Which newly acquired devices this recipe needed. Only set by a discovery query.
          type: array
          items: { type: string }

    EquipmentMatch:
      description: A recipe plus its fit — the shape POST /equipment/match returns.
      x-go-types: [recipe.EquipmentMatch]
      allOf:
        - $ref: "#/components/schemas/Recipe"
        - $ref: "#/components/schemas/EquipmentFit"

    EquipmentCounts:
      type: object
      description: |-
        Bucket sizes over every recipe considered — including recipes the
        narrowed list omits, so "N we can't assess" keeps an honest denominator.
      x-go-types: [recipe.EquipmentCounts]
      required: [makeable, blocked, unknown]
      properties:
        makeable: { type: integer }
        blocked: { type: integer }
        unknown: { type: integer }

    EquipmentMatchResult:
      type: object
      x-go-types: [recipe.EquipmentMatchResult]
      required: [recipes, counts]
      properties:
        recipes:
          type: array
          items: { $ref: "#/components/schemas/EquipmentMatch" }
        counts: { $ref: "#/components/schemas/EquipmentCounts" }

    EquipmentMatchRequest:
      type: object
      x-go-unbound: decoded into an anonymous struct in the equipmentMatch handler.
      x-go-direction: request
      required: [owned]
      properties:
        owned:
          description: Every equipment slug the user has.
          type: array
          items: { type: string }
        acquired:
          description: |-
            Turns this into the new-device query. Its members must also appear in
            `owned` — you cannot be unlocked by hardware you don't have.
          type: array
          items: { type: string }

    # ── Normalization dictionary ────────────────────────────────────────────
    PurchasePack:
      type: object
      description: An item's typical pack, as the dataset knows it — "bunch", 0.5 cup.
      x-go-types: [recipe.PurchasePack]
      required: [unit, size, sizeUnit]
      properties:
        unit: { type: string }
        size: { type: number }
        sizeUnit: { type: string }

    ItemDetails:
      type: object
      description: |-
        Everything the normalizer knows about one ingredient — the wire shape of
        POST /normalization/lookup, which is how Convex reads shelf life without
        keeping a second copy of the table.
      x-go-types: [recipe.ItemDetails]
      required: [canonicalItem, display, aisle, known]
      properties:
        canonicalItem: { type: string }
        display: { type: string }
        aisle: { type: string }
        shelfLifeDays:
          description: >-
            Absent rather than zero when unknown, so callers can tell "we don't
            know" from "it expires today".
          type: integer
        category:
          description: The what-is-it axis prep rules match on; absent when unclassified.
          type: string
        staple:
          description: >-
            A keep-on-hand ingredient. Absent (false) for every unknown item: we
            do not assume something we failed to recognize is one.
          type: boolean
        allergens:
          description: |-
            The allergen families this item belongs to, sorted, or absent for an
            item in none — and for every unknown item, since an ingredient we do
            not recognize is one whose allergens we cannot claim to know.

            A LIST because families overlap: egg noodles are both egg and wheat.
          type: array
          items: { type: string }
        purchase:
          description: >-
            The typical purchase size, when the dataset knows one. Absent means
            "sold however the recipe measures it, as far as we know".
          $ref: "#/components/schemas/PurchasePack"
        known:
          description: |-
            Whether the dataset actually recognized the item. Unknown items still
            get a `canonicalItem` — the normalized raw text — so callers can group
            by it, but nothing else about them is asserted. Callers that need to
            tell "we know this is bread" from "we have never seen this word" must
            read this rather than inferring it from an "other" aisle.
          type: boolean

    NormalizationLookupRequest:
      type: object
      x-go-unbound: decoded into an anonymous struct in the normalizationLookup handler.
      x-go-direction: request
      required: [items]
      properties:
        items:
          description: Raw ingredient text; canonicalization happens server-side.
          type: array
          items: { type: string }

    NormalizationLookupResponse:
      type: object
      x-go-unbound: written inline by the normalizationLookup handler as a map literal.
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ItemDetails" }

    AvoidResolutionKind:
      type: string
      description: |-
        What one avoid-list entry turned out to be (BL-0052).

        - `item` — one canonical ingredient.
        - `allergen` — a whole family, which excludes every one of its `members`.
        - `unknown` — the dictionary has never seen this text, so the entry will
          remove no recipe. That case is the reason this type exists: an avoid
          entry that silently matches nothing is the bug, and for a declared
          allergy it is not a cosmetic one.
      x-go-unbound: a bare string on the Go side; ResolveAvoid decides the member.
      enum: [item, allergen, unknown]

    AvoidResolution:
      type: object
      description: The wire shape of POST /normalization/avoid, one entry in, one out.
      x-go-types: [recipe.AvoidResolution]
      required: [input, canonicalItem, display, kind]
      properties:
        input:
          description: The text the user actually typed, so a client can say "scallion → green onion".
          type: string
        canonicalItem:
          description: "What gets STORED: a canonical item key, a family key, or the normalized text."
          type: string
        display: { type: string }
        kind: { $ref: "#/components/schemas/AvoidResolutionKind" }
        members:
          description: Display names of everything an allergen family excludes. `allergen` only.
          type: array
          items: { type: string }
        families:
          description: Families a single item belongs to — a nudge toward the broader entry. `item` only.
          type: array
          items: { type: string }

    AvoidResolutionRequest:
      type: object
      x-go-unbound: decoded into an anonymous struct in the normalizationAvoid handler.
      x-go-direction: request
      required: [entries]
      properties:
        entries:
          type: array
          items: { type: string }

    AvoidResolutionResponse:
      type: object
      x-go-unbound: written inline by the normalizationAvoid handler as a map literal.
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/AvoidResolution" }

    UnresolvedIngredient:
      type: object
      description: >-
        One piece of ingredient text the dictionary did not recognize, with how
        often it appeared and where.
      x-go-types: [recipe.UnresolvedIngredient]
      required: [item, count, examples]
      properties:
        item:
          description: The text as the normalizer saw it, lowercased and trimmed.
          type: string
        count: { type: integer }
        examples:
          description: Recipe titles the text appeared in, so an operator can go look at the line.
          type: array
          items: { type: string }

    CoverageReport:
      type: object
      description: The dictionary's report card over some body of ingredient text.
      x-go-types: [recipe.CoverageReport]
      required: [lines, resolved, share, unresolved]
      properties:
        lines: { type: integer }
        resolved: { type: integer }
        share:
          description: >-
            resolved/lines in [0,1], and 0 for an empty corpus — nothing measured
            is not full marks.
          type: number
        unresolved:
          description: >-
            Ordered by count descending, then item ascending, so the most valuable
            dictionary entry to write next is always first.
          type: array
          items: { $ref: "#/components/schemas/UnresolvedIngredient" }

    # ── Nutrition ───────────────────────────────────────────────────────────
    NutrientAmount:
      type: object
      description: |-
        One nutrient amount, keyed by FDC nutrient number ("1008" energy kcal,
        "1003" protein, "1253" cholesterol). We use FDC's numbering rather than
        inventing a parallel taxonomy.
      x-go-types: [nutrition.NutrientAmount]
      required: [nutrientId, amount, unit]
      properties:
        nutrientId: { type: string }
        amount: { type: number }
        unit: { type: string }

    NutritionCoverage:
      type: object
      description: How much of a recipe the estimate actually accounts for. Never optional.
      x-go-types: [nutrition.Coverage, recommend.NutritionCoverage]
      required: [resolvedMassFraction, resolvedCount, totalCount]
      properties:
        resolvedMassFraction:
          description: 0..1 of the recipe's mass that resolved to a food with nutrient data.
          type: number
        resolvedCount: { type: integer }
        totalCount: { type: integer }

    NutritionIngredient:
      type: object
      description: "Per-ingredient provenance: what we made of each line, and why we failed."
      x-go-types: [nutrition.IngredientEstimate]
      required: [item, grams, resolved]
      properties:
        item: { type: string }
        grams:
          description: null when the line's mass could not be determined.
          type: [number, "null"]
        resolved:
          description: True only if the line contributed nutrients — mass known AND food matched.
          type: boolean
        reason:
          description: 'Why the line is unresolved, e.g. `no gram weight for unit "pinch"`.'
          type: string
        method:
          description: "How the grams were derived: mass | portion | density | count."
          type: string
        matchedFood:
          description: The FDC description matched, so a wrong fuzzy match is visible.
          type: string

    NutritionRecipeCoverage:
      type: object
      description: |-
        One recipe's contribution to a multi-recipe rollup (BL-0037).

        A single blended `resolvedMassFraction` cannot express every way a rollup
        is incomplete: it describes the food it *saw*. A recipe that could not be
        loaded at all contributes to neither side of that ratio, so a day missing
        a whole dinner would otherwise read as fully covered. `counted` is that
        case, named.
      x-go-types: [nutrition.RecipeCoverage]
      required: [recipeId, multiplier, counted, coverage]
      properties:
        recipeId: { type: string }
        title:
          description: Absent when the recipe could not be read — an unreadable recipe leaks nothing.
          type: string
        multiplier:
          description: The servings dial this recipe contributed at.
          type: number
        counted:
          description: False when the recipe's ingredients never reached the totals at all.
          type: boolean
        coverage:
          description: This recipe's own coverage, so the one bad dish can be named.
          $ref: "#/components/schemas/NutritionCoverage"

    NutritionEstimate:
      type: object
      description: |-
        An estimated nutrient vector for a recipe or a selection of recipes.

        `nutrients` is an open map on purpose — adding a nutrient must be a data
        change, never a wire-type change across three languages. Do not narrow it
        to a typed macro struct.
      x-go-types: [nutrition.Estimate]
      required: [nutrients, servings, coverage, ingredients, estimatedAt]
      properties:
        nutrients:
          type: object
          additionalProperties: { $ref: "#/components/schemas/NutrientAmount" }
        perServing:
          description: Absent when the recipe's yield is unknown; never divided by a guess.
          type: object
          additionalProperties: { $ref: "#/components/schemas/NutrientAmount" }
        servings: { type: number }
        coverage: { $ref: "#/components/schemas/NutritionCoverage" }
        ingredients:
          type: array
          items: { $ref: "#/components/schemas/NutritionIngredient" }
        estimatedAt:
          type: string
          format: date-time
        recipes:
          description: >-
            Present only on a rollup (POST /nutrition/estimate), where "which dish
            is missing?" is a question the blended coverage figure cannot answer.
          type: array
          items: { $ref: "#/components/schemas/NutritionRecipeCoverage" }

    NutritionEstimateRequest:
      type: object
      x-go-unbound: decoded into an anonymous struct in the nutritionEstimate handler.
      x-go-direction: request
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GroceryListItem" }

    # ── Pricing ─────────────────────────────────────────────────────────────
    PriceStaleness:
      type: string
      description: How stale the underlying price table is, graded when the estimate is made.
      x-go-unbound: pricing.Staleness is a named string type, checked as a string.
      enum: [fresh, aging, stale]

    PriceBasis:
      type: object
      description: >-
        Provenance for an estimate. A total shown without this is a number
        pretending to be a price.
      x-go-types: [pricing.Basis]
      required: [source, sourceUrl, area, observationMonth, staleness]
      properties:
        source: { type: string }
        sourceUrl: { type: string }
        area:
          description: Geographic basis of the averages, e.g. "U.S. city average".
          type: string
        observationMonth:
          description: '"YYYY-MM" the prices were observed.'
          type: string
        staleness: { $ref: "#/components/schemas/PriceStaleness" }
        store: { $ref: "#/components/schemas/StorePriceBasis" }

    PricedLine:
      type: object
      description: >-
        Per-line outcome. Unpriced lines carry a reason and contribute nothing to
        the total.
      x-go-types: [pricing.LineEstimate]
      required: [canonicalItem, item, priced]
      properties:
        canonicalItem: { type: string }
        item: { type: string }
        priced: { type: boolean }
        cents: { type: integer }
        bucket:
          description: Which coarse price bucket the ingredient resolved to.
          type: string
        bucketLabel: { type: string }
        reason:
          description: Why the line could not be priced, when `priced` is false.
          type: string
        source: { $ref: "#/components/schemas/PriceSource" }
        product:
          description: >-
            The shelf item a store price came from, so a number can be shown as
            the price of something specific. Absent for an average.
          type: string
        onSale:
          description: >-
            True when the store price is a promotion rather than the regular
            shelf price, and so will not last.
          type: boolean

    CostEstimate:
      type: object
      description: |-
        Grocery pricing (BL-0023 increment 1).

        Deliberately a separate contract from GroceryLine rather than fields on
        it: price data has its own source, refresh cadence and legal constraints,
        and the grocery list must keep working when pricing is unavailable.
      x-go-types: [pricing.Estimate]
      required: [currency, totalCents, pricedCount, unpricedCount, lines, basis]
      properties:
        currency: { type: string }
        totalCents: { type: integer }
        pricedCount: { type: integer }
        unpricedCount: { type: integer }
        lines:
          type: array
          items: { $ref: "#/components/schemas/PricedLine" }
        basis: { $ref: "#/components/schemas/PriceBasis" }

    PricingLine:
      type: object
      description: >-
        One aggregated grocery line to price: the normalized identity plus its
        quantity.
      x-go-types: [pricing.Line]
      x-go-direction: request
      required: [canonicalItem, item, unit, quantity]
      properties:
        canonicalItem: { type: string }
        item: { type: string }
        unit: { type: string }
        quantity: { type: number }

    PricingEstimateRequest:
      type: object
      x-go-unbound: decoded into an anonymous struct in the pricingEstimate handler.
      x-go-direction: request
      required: [lines]
      properties:
        lines:
          type: array
          items: { $ref: "#/components/schemas/PricingLine" }
        storeLocationId:
          description: >-
            The store the user opted into (BL-0046). Absent — which is every
            user who has not chosen one — prices the list from the national
            averages alone.
          type: string
        storeProvider:
          description: >-
            Who `storeLocationId` belongs to. A selection outlives the
            deployment that made it, and a location id means something else at
            a different retailer, so a mismatch is ignored rather than priced.
          type: string

    PriceSource:
      type: string
      description: >-
        Which table priced a line. Absent on an unpriced line, where there is no
        number to attribute.
      x-go-unbound: a plain string field on pricing.LineEstimate, checked as a string.
      enum: [average, store]

    StorePriceBasis:
      type: object
      description: |-
        Provenance for the store-priced half of an estimate (BL-0046).

        It sits alongside the averages basis rather than replacing it, because a
        mixed estimate genuinely has two sources, and is present only when the
        chosen store actually priced something.
      x-go-types: [pricing.StoreBasis]
      required: [provider, locationId, fetchedAt, pricedCount]
      properties:
        provider: { type: string }
        locationId: { type: string }
        storeName: { type: string }
        fetchedAt:
          description: RFC 3339. Shelf prices move daily, so the age of the quote is part of the number.
          type: string
        pricedCount:
          description: >-
            How many lines the store priced. The rest came from the averages,
            and saying so is what keeps a mixed total honest.
          type: integer

    StoreLocation:
      type: object
      description: One store a user can choose to price against.
      x-go-types: [pricing.StoreLocation]
      required: [locationId, name]
      properties:
        locationId: { type: string }
        name: { type: string }
        chain: { type: string }
        address: { type: string }
        city: { type: string }
        state: { type: string }
        zipCode: { type: string }

    StoreSearchRequest:
      type: object
      x-go-unbound: decoded into an anonymous struct in the pricingStores handler.
      x-go-direction: request
      required: [zipCode]
      properties:
        zipCode: { type: string }
        radiusMiles:
          description: Defaults to 10 and is capped at 100 by the provider.
          type: integer

    StoreSearchResult:
      type: object
      description: >-
        Nearby stores. An empty provider means real store prices are not
        configured, which a client renders by offering no chooser at all.
      x-go-types: [pricing.StoreSearch]
      required: [provider, stores]
      properties:
        provider: { type: string }
        stores:
          type: array
          items: { $ref: "#/components/schemas/StoreLocation" }

    StoreProviderStatus:
      type: object
      description: >-
        Whether real store prices are configured on this deployment. This is the
        BL-0046 feature flag as seen from outside the service.
      x-go-types: [pricing.StoreProviderStatus]
      required: [enabled, provider]
      properties:
        enabled: { type: boolean }
        provider: { type: string }

    # ── Recommendations ─────────────────────────────────────────────────────
    PantryContextItem:
      type: object
      description: One pantry row as the recommender sees it.
      x-go-types: [recommend.PantryItem]
      x-go-direction: request
      required: [canonicalItem, state]
      properties:
        canonicalItem: { type: string }
        state:
          type: string
          enum: [have, low, out]
        useItUp: { type: boolean }
        useBy:
          description: |-
            Approximate spoil date, epoch ms (BL-0029). Absent when the
            shelf-life table doesn't recognize the item — which is not the same
            as "keeps forever", and is why the ranker treats absence as no signal
            rather than as a far-off date.
          type: integer

    RecommendationPreferences:
      type: object
      description: "Ingredient-grounded preferences. `avoidItems` is a hard filter, not a weight."
      x-go-types: [recommend.Preferences]
      x-go-direction: request
      required: [avoidItems, likedItems, dislikedItems]
      properties:
        avoidItems:
          type: array
          items: { type: string }
        likedItems:
          type: array
          items: { type: string }
        dislikedItems:
          type: array
          items: { type: string }
        cuisines:
          description: |-
            Cuisine slugs the cook says they like (BL-0030), from the same open
            vocabulary a recipe's single `cuisine` is stored in.

            A SET here against one value on the recipe: a cook likes several
            cuisines, a dish is one of them. Omitted or empty means no stated
            taste, which makes the ranker's `cuisineMatch` unavailable rather
            than making every recipe a miss.
          type: array
          items: { type: string }
        maxMinutes:
          description: |-
            The cook time the user is willing to spend, in minutes, or omitted
            for no opinion.

            A recipe whose `totalMinutes` is unknown is scored against this as
            UNMEASURED, never as fast — an untimed recipe winning "I have 20
            minutes" is the failure this field is most likely to cause if read
            carelessly.
          type: integer

    NutritionTargetOperator:
      type: string
      description: |-
        Nutrition targets (BL-0038).

        A goal is a *constraint*, never a feature. "150 g of protein a day",
        "keep cholesterol under 200 mg", "stay under 2,000 calories" and "low
        carb" differ only in their field values, so one row shape and one
        evaluator serve all of them — and serve goals nobody has asked for yet.
        There is deliberately no `lowCarbMode` boolean anywhere in the system.
      x-go-unbound: a bare string on the Go side.
      enum: ["<=", ">=", "=="]

    NutritionTargetPeriod:
      type: string
      description: |-
        The window a target is measured over. `meal` is a single serving of a
        single recipe, which is what makes a "fits your goals" badge on a recipe
        possible without inventing a second concept.
      x-go-unbound: a bare string on the Go side.
      enum: [day, week, meal]

    RecommendationNutritionTarget:
      type: object
      description: >-
        One nutrition goal as the recommender sees it (BL-0040) — the stored
        `nutritionTargets` row minus `active`, because only active goals are ever
        sent.
      x-go-types: [recommend.NutritionTarget]
      x-go-direction: request
      required: [nutrientId, operator, value, period]
      properties:
        nutrientId: { type: string }
        operator: { $ref: "#/components/schemas/NutritionTargetOperator" }
        value: { type: number }
        period: { $ref: "#/components/schemas/NutritionTargetPeriod" }
        label: { type: string }
        hard: { type: boolean }

    RecommendationPlanNutrition:
      type: object
      description: >-
        What the week's plan ALREADY commits, so a `week` target is scored on the
        gap that remains rather than on the whole goal.
      x-go-types: [recommend.PlanNutrition]
      x-go-direction: request
      required: [nutrients, coverage]
      properties:
        nutrients:
          description: nutrientId -> amount, in the estimate's units.
          type: object
          additionalProperties: { type: number }
        coverage: { $ref: "#/components/schemas/NutritionCoverage" }

    RecommendationInteraction:
      type: object
      description: |-
        Recent event counts for ONE recipe. Counts, not events: the ranker has no
        business knowing when something happened or in what order, which is what
        keeps it stateless.
      x-go-types: [recommend.RecipeInteraction]
      x-go-direction: request
      required: [shown, accepted, dismissed, cooked]
      properties:
        shown: { type: integer }
        accepted: { type: integer }
        dismissed: { type: integer }
        cooked: { type: integer }

    RecommendationRequest:
      type: object
      description: >-
        Everything the ranker knows about the caller for one request. The ranker
        is stateless by construction: it holds no user state, so all of it
        arrives here.
      x-go-types: [recommend.UserContext]
      x-go-direction: request
      required: [pantry, preferences]
      properties:
        pantry:
          type: array
          items: { $ref: "#/components/schemas/PantryContextItem" }
        preferences: { $ref: "#/components/schemas/RecommendationPreferences" }
        affinities:
          description: |-
            canonicalItem → [-1, 1], DERIVED by Convex from its interaction log
            at request time and never stored as a score (BL-0005 increment 2).

            Omitted or empty means "no signal", which makes the ranker's
            `affinity` feature UNAVAILABLE rather than scoring every candidate
            zero. That distinction is the whole cold-start guarantee: a user who
            has done nothing has told us nothing, and nothing must not be read as
            dislike.
          type: object
          additionalProperties: { type: number }
        savedRecipeIds:
          description: >-
            Recipes the user already has a copy of. The discover surface REMOVES
            them; the pantry surface ignores the field.
          type: array
          items: { type: string }
        interactions:
          description: |-
            Recent per-recipe interaction counts, keyed by recipe id. Read only
            by the discover surface.

            An OMITTED field and an EMPTY object are different: omitted means no
            history was sent, so `novelty` is unavailable; empty means this user
            has interacted with nothing, which makes every candidate equally new.
          type: object
          additionalProperties: { $ref: "#/components/schemas/RecommendationInteraction" }
        excludeRecipeIds:
          type: array
          items: { type: string }
        limit: { type: integer }
        includeUnmatched:
          description: >-
            Keep candidates that share nothing with the pantry (BL-0033). The
            "cook what you have" surface drops them as noise; set selection needs
            them, because a dish can earn its place by sharing ingredients with
            the other dinners.
          type: boolean
        now:
          description: >-
            The caller's clock, epoch ms. Sent rather than read from the server
            clock so scoring stays a pure function of its input. Omitting it makes
            expiry unavailable — absent data degrades to "no signal", never to a
            guess.
          type: integer
        nutritionTargets:
          description: "ACTIVE goals only: a paused goal is not a goal."
          type: array
          items: { $ref: "#/components/schemas/RecommendationNutritionTarget" }
        planNutrition:
          oneOf:
            - $ref: "#/components/schemas/RecommendationPlanNutrition"
            - type: "null"

    RecommendationMissingItem:
      type: object
      description: An ingredient the recipe needs that the user does not have.
      x-go-types: [recommend.MissingItem]
      required: [canonicalItem, display, staple]
      properties:
        canonicalItem: { type: string }
        display: { type: string }
        staple:
          description: |-
            A keep-on-hand ingredient — salt, oil, the spice rack (BL-0031).

            It lets a card say "you have everything but the salt" instead of
            listing salt beside chicken as though they were the same errand.
            False for anything the dictionary does not recognize, which is the
            conservative reading.
          type: boolean

    RecommendationUnverifiedConstraint:
      type: object
      description: |-
        A HARD constraint this candidate could not be checked against.

        It carries the nutrient id rather than a rendered string because only the
        client has the nutrient catalog to name it with. Its existence is the
        reason an unmeasured recipe can survive a filter without being presented
        as having passed it.
      x-go-types: [recommend.UnverifiedConstraint]
      required: [nutrientId]
      properties:
        nutrientId: { type: string }
        label: { type: string }

    RecommendationUrgency:
      type: object
      description: |-
        The most-urgent expiring ingredient a recipe would clear (BL-0050).

        Typed rather than folded into `reasons` so the card can render "use this
        soon" distinctly from "you'd like this" — they are different kinds of
        claim, and telling them apart by prefix-matching a reason string would be
        brittle.
      x-go-types: [recommend.Urgency]
      required: [canonicalItem, display, useBy]
      properties:
        canonicalItem: { type: string }
        display: { type: string }
        useBy:
          description: Epoch ms, so the card formats it with the same helper as its items strip.
          type: integer

    Recommendation:
      type: object
      description: >-
        One ranked recommendation, carrying the reasons that produced it so the
        UI can explain itself without knowing anything about scoring.
      x-go-types: [recommend.Result]
      required: [recipeId, title, source, score, reasons, have, missing, nutritionFit, nutritionUnverified]
      properties:
        recipeId: { type: string }
        title: { type: string }
        source:
          description: |-
            Where the candidate came from. "generated" is an idea a model
            invented for this request (BL-0034) — NOT a curated, tested recipe,
            and the UI must say so. It carries a synthetic `gen-` recipeId that
            names no stored row until the user accepts it; its full draft rides
            in `RecommendationResponse.generated`.
          type: string
          enum: [catalog, user, generated]
        score: { type: number }
        reasons:
          type: array
          items: { type: string }
        have:
          type: array
          items: { type: string }
        missing:
          type: array
          items: { $ref: "#/components/schemas/RecommendationMissingItem" }
        urgency:
          description: Absent when nothing this recipe uses is expiring within the horizon.
          $ref: "#/components/schemas/RecommendationUrgency"
        nutritionFit:
          description: >-
            0..1 for how well this candidate closes the plan's remaining gap, or
            null when nothing could be measured. Null rather than 0: a data gap is
            not a bad score, and the two must never look alike.
          type: [number, "null"]
        nutritionUnverified:
          type: array
          items: { $ref: "#/components/schemas/RecommendationUnverifiedConstraint" }

    GeneratedRecipeDraft:
      type: object
      description: |-
        A recipe a model invented for one request (BL-0034).

        It is a DRAFT: no row exists for it, and its `recipeId` is a synthetic
        `gen-` id that resolves to nothing. It rides back with the ranked results
        purely so that accepting a suggestion can persist exactly what the user
        was shown, instead of asking the model again and getting something
        slightly different.

        Only drafts whose candidate SURVIVED ranking appear here. One the
        avoid-list filter removed is absent from `results` and absent from this
        list too — a draft the user could save is as dangerous as a result they
        could see.
      x-go-types: [recipe.GeneratedRecipe]
      required: [recipeId, title, ingredients, steps]
      properties:
        recipeId:
          description: Joins to the `Recommendation` with the same id.
          type: string
        title: { type: string }
        servings:
          description: Absent when the model gave no usable yield — unknown, never zero.
          type: integer
        ingredients:
          type: array
          items: { $ref: "#/components/schemas/Ingredient" }
        steps:
          type: array
          items: { type: string }

    RecommendationResponse:
      type: object
      x-go-unbound: written inline by the recommendPantry handler as a map literal.
      required: [results, generated]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/Recommendation" }
        generated:
          description: >-
            The full text of every generated candidate in `results`. Always
            present and always an array — empty whenever generation is
            unconfigured, ungated or unproductive, which is the common case.
          type: array
          items: { $ref: "#/components/schemas/GeneratedRecipeDraft" }

    DiscoverResponse:
      type: object
      description: |-
        `POST /recommendations/discover` — the sibling of the pantry surface.

        No `generated` sidecar, and that is a decision rather than an omission:
        an invented recipe is the opposite of a discovery. This surface exists to
        surface recipes that already exist and that somebody has actually cooked.
      x-go-unbound: written inline by the recommendDiscover handler as a map literal.
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/Recommendation" }

    # ── Prep tasks ──────────────────────────────────────────────────────────
    PrepTask:
      type: object
      description: One piece of lead-time work for one meal on one date.
      x-go-types: [recipe.PrepTask]
      required: [key, ruleId, subject, window, text, source, dueOn]
      properties:
        key:
          description: >-
            Stable across re-derivation: `ruleId:subject`. Check-off is keyed on
            it, so editing a rule's text preserves the tick and changing a rule's
            id deliberately does not.
          type: string
        ruleId: { type: string }
        subject:
          description: The canonical ingredient, cooking method, or equipment slug the rule matched.
          type: string
        window: { $ref: "#/components/schemas/PrepWindow" }
        text: { type: string }
        source: { $ref: "#/components/schemas/PrepSource" }
        dueOn:
          description: "ISO date the task is due: the cook date minus the window's lead time."
          type: string
          format: date
        missed:
          description: >-
            The due date has already passed. A missed task is still returned —
            the whole point of lead time is that forgetting it is the failure
            worth reporting, not something to hide.
          type: boolean

    PrepMeal:
      type: object
      description: Derived prep for one planned meal.
      x-go-types: [recipe.PrepMeal]
      required: [recipeId, title, cookDate, tasks]
      properties:
        recipeId: { type: string }
        title: { type: string }
        cookDate:
          description: ISO date the meal is planned for.
          type: string
          format: date
        tasks:
          type: array
          items: { $ref: "#/components/schemas/PrepTask" }

    PrepTasksResponse:
      type: object
      x-go-types: [recipe.PrepTasksResponse]
      required: [rulesVersion, meals]
      properties:
        rulesVersion:
          description: Revision of the rule table that produced these tasks, for traceability.
          type: string
        meals:
          type: array
          items: { $ref: "#/components/schemas/PrepMeal" }

    PrepTasksRequestMeal:
      type: object
      x-go-unbound: decoded into an anonymous struct in the prepTasks handler.
      x-go-direction: request
      required: [recipeId, cookDate]
      properties:
        recipeId: { type: string }
        cookDate:
          type: string
          format: date

    PrepTasksRequest:
      type: object
      x-go-unbound: decoded into an anonymous struct in the prepTasks handler.
      x-go-direction: request
      required: [meals]
      properties:
        meals:
          type: array
          items: { $ref: "#/components/schemas/PrepTasksRequestMeal" }
        today:
          description: >-
            The caller's local date. Supplied rather than read from the server
            clock: a prep schedule that slips a day is worse than no prep
            schedule. Omit to leave `missed` unset.
          type: string
          format: date
