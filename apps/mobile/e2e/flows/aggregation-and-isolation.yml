# Per-user isolation, across a sign-out (BL-0004).
#
# The mobile counterpart of `apps/web/e2e/aggregation-and-isolation.spec.ts`,
# and deliberately only half of it. That spec proves two things: that two
# recipes calling for garlic collapse into one grocery line, and that a
# brand-new account sees none of the previous account's data. The first needs
# two authored recipes, which this client cannot do yet (BL-0063);
# `flowParity.ts` records it as the missing half rather than letting the file
# name imply coverage it does not have.
#
# The isolation half is worth having on its own, and is more than a repeat of
# the web assertion: the native client keeps its session in the keychain and its
# grocery list in a device cache (BL-0058), so "a second account sees an empty
# list" is a claim about the client's own storage as much as about the server's
# scoping. A sign-out that left either behind would show account A's line here.
appId: com.pantry.app
name: aggregation-and-isolation
tags:
  - core
---
- runFlow: ../subflows/launch-signed-out.yml
- runFlow: ../subflows/sign-up.yml

# --- account A puts one line on its list ---
- tapOn:
    id: "nav.tab.list"
- extendedWaitUntil:
    visible:
      id: "list.empty-state"
    timeout: 60000
- runFlow: ../subflows/add-manual-item.yml

# --- sign out returns to the auth gate ---
- tapOn:
    id: "nav.tab.settings"
- tapOn:
    id: "settings.sign-out"
- extendedWaitUntil:
    visible:
      id: "auth.form"
    timeout: 30000

# --- account B is a different account, minted by the runner for this run ---
- runFlow:
    file: ../subflows/sign-up.yml
    env:
      E2E_EMAIL: ${E2E_EMAIL_2}
- tapOn:
    id: "nav.tab.list"
- extendedWaitUntil:
    visible:
      id: "list.empty-state"
    timeout: 60000
