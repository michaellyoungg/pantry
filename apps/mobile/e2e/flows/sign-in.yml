# The first flow, and the one that proves the harness rather than the product.
#
# It is the whole auth loop rather than only the sign-in half because the
# deployment is fresh: there is no account to sign in as until one is
# registered. Once there is, signing out and back in costs three steps and is
# the only path that reads a session back out of SecureStore.
#
# Landing on the plan is the navigation assertion. `plan` is a
# `PlaceholderScreen` until BL-0064, which is fine — what this asserts is that
# the tab bar routes.
appId: com.pantry.app
name: sign-in
tags:
  - smoke
---
- runFlow: ../subflows/launch-signed-out.yml
- runFlow: ../subflows/sign-up.yml

- tapOn:
    id: "nav.tab.settings"
- tapOn:
    id: "settings.sign-out"
- extendedWaitUntil:
    visible:
      id: "auth.form"
    timeout: 30000

- runFlow: ../subflows/sign-in.yml

- tapOn:
    id: "nav.tab.plan"
- assertVisible:
    id: "plan.screen"
