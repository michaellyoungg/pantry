# Maestro workspace configuration (BL-0072).
#
# `subflows/` is outside `flows:` deliberately: each one assumes a caller has
# launched the app and set E2E_EMAIL, so running one standalone fails in a way
# that looks like a product bug.
flows:
  - "flows/*.yml"

executionOrder:
  # The suite runs nightly (BL-0073), so a run costs a runner, a native build
  # and the better part of an hour. Stopping at the first failure would spend
  # all of that to learn one fact, and the flows are independent by
  # construction — every one launches with `clearState` and signs up its own
  # account — so a failure in one says nothing about the next. Whoever reads
  # the morning's report should see the whole picture rather than the first
  # line of it.
  continueOnFailure: true
